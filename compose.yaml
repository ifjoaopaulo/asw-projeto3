services:
  banco:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    volumes:
      - banco_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports: 
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: banco
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      DB_NAME: ecommerce
    depends_on:
      banco: 
        condition: service_healthy

volumes:
  banco_data:
